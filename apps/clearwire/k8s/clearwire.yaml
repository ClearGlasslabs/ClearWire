apiVersion: v1
kind: Namespace
metadata:
  name: clearwire
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearwire-api
  namespace: clearwire
spec:
  replicas: 2
  selector: {matchLabels: {app: clearwire-api}}
  template:
    metadata: {labels: {app: clearwire-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/clearglasslabs/clearwire-api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: clearwire-secrets}}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata:
  name: clearwire-api
  namespace: clearwire
spec:
  selector: {app: clearwire-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearwire-frontend
  namespace: clearwire
spec:
  replicas: 2
  selector: {matchLabels: {app: clearwire-frontend}}
  template:
    metadata: {labels: {app: clearwire-frontend}}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/clearglasslabs/clearwire-frontend:latest
          ports: [{containerPort: 3000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
