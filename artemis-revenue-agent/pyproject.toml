[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clearglass-artemis-revenue-agent"
version = "1.0.0"
description = "Fixed-scope cybersecurity lead qualification, scoring, and human-handoff service for ClearGlass Inc."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[project.scripts]
artemis-revenue-agent = "artemis_revenue_agent.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["artemis_revenue_agent*"]
