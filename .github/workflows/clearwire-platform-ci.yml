name: Clearwire Platform CI
on:
  pull_request:
    paths: ['apps/clearwire/**']
  push:
    branches: [main]
    paths: ['apps/clearwire/**']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clearwire/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clearwire/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/clearwire/frontend/package.json
      - run: npm install
      - run: npm run build
